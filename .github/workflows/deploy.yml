name: Deploy to Vercel

# Deploys run under the project owner's Vercel token, so Vercel's
# "git author must have access to the project" check never applies —
# any collaborator's commits deploy normally.
#
# The project is identified by slug (--scope / --project) instead of by
# VERCEL_ORG_ID / VERCEL_PROJECT_ID, so there are no ids to mistype.
# VERCEL_TOKEN is the only secret this workflow needs.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: attack2
      VERCEL_PROJECT: uniforms-sales
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Diagnostics - which account does the token belong to
        run: |
          vercel whoami --token="$VERCEL_TOKEN" || true
          vercel teams ls --token="$VERCEL_TOKEN" || true

      - name: Link project by name
        run: vercel link --yes --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT" --token="$VERCEL_TOKEN"

      - name: Pull environment
        run: vercel pull --yes --environment="$TARGET" --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build
        run: |
          if [ "$TARGET" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "$TARGET" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Preview deployment: ' + process.env.PREVIEW_URL
            })
